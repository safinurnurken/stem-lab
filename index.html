<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEM Lab — Электрическая цепь</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  h1 {
    font-size: 28px;
    margin-bottom: 10px;
    text-align: center;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .subtitle {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 20px;
    text-align: center;
  }
  
  .lab {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 20px;
    max-width: 750px;
    width: 100%;
    backdrop-filter: blur(10px);
  }
  
  canvas {
    background: #0a0a1a;
    border-radius: 15px;
    display: block;
    margin: 0 auto;
    width: 100%;
    height: auto;
    max-width: 650px;
  }
  
  .controls {
    margin-top: 20px;
    display: grid;
    gap: 15px;
  }
  
  .control-group {
    background: rgba(255, 255, 255, 0.05);
    padding: 12px 15px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  
  .control-group label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 8px;
    color: #ccc;
  }
  
  .control-group label span {
    color: #ffd700;
    font-weight: bold;
  }
  
  input[type="range"] {
    width: 100%;
    height: 6px;
    -webkit-appearance: none;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    outline: none;
  }
  
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
  }
  
  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
  }
  
  button {
    flex: 1;
    min-width: 140px;
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .btn-primary {
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #1a1a2e;
  }
  
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
  }
  
  .btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  
  .btn-secondary:hover {
    background: rgba(255, 255, 255, 0.2);
  }
  
  .info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 20px;
  }
  
  .info-card {
    background: rgba(255, 215, 0, 0.1);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  
  .info-card .value {
    font-size: 22px;
    font-weight: bold;
    color: #ffd700;
  }
  
  .info-card .label {
    font-size: 11px;
    color: #aaa;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .formula {
    text-align: center;
    margin-top: 15px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    font-family: 'Courier New', monospace;
    color: #ffd700;
    font-size: 16px;
  }
  
  .task {
    background: rgba(0, 210, 255, 0.1);
    border: 1px solid rgba(0, 210, 255, 0.3);
    border-radius: 12px;
    padding: 12px 15px;
    margin-top: 15px;
    font-size: 13px;
    color: #00d2ff;
  }
  
  @media (max-width: 600px) {
    h1 { font-size: 22px; }
    .info { grid-template-columns: repeat(3, 1fr); }
    .info-card .value { font-size: 18px; }
  }
</style>
</head>
<body>

<h1>⚡ STEM Lab</h1>
<p class="subtitle">Интерактивный симулятор электрической цепи — физика без лаборатории</p>

<div class="lab">
  <canvas id="canvas" width="650" height="400"></canvas>
  
  <div class="controls">
    <div class="control-group">
      <label>Напряжение (U) <span id="voltageValue">6 В</span></label>
      <input type="range" id="voltage" min="1" max="12" value="6" step="0.5">
    </div>
    
    <div class="control-group">
      <label>Сопротивление (R) <span id="resistanceValue">10 Ом</span></label>
      <input type="range" id="resistance" min="2" max="50" value="10" step="1">
    </div>
    
    <div class="buttons">
      <button class="btn-primary" id="toggleBtn">🔌 Замкнуть цепь</button>
      <button class="btn-secondary" id="resetBtn">⟲ Сбросить</button>
    </div>
  </div>
  
  <div class="info">
    <div class="info-card">
      <div class="value" id="currentValue">0.60</div>
      <div class="label">Ток (А)</div>
    </div>
    <div class="info-card">
      <div class="value" id="powerValue">3.60</div>
      <div class="label">Мощность (Вт)</div>
    </div>
    <div class="info-card">
      <div class="value" id="statusValue">Разомкнута</div>
      <div class="label">Статус</div>
    </div>
  </div>
  
  <div class="formula">I = U / R    |    P = U × I</div>
  
  <div class="task">
    🎯 <b>Задача:</b> Сделай так, чтобы лампочка горела ярко (мощность ≥ 8 Вт). Какие напряжение и сопротивление для этого нужны?
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let voltage = 6;
let resistance = 10;
let isClosed = false;
let glowIntensity = 0; // 0..1 для анимации

const voltageSlider = document.getElementById('voltage');
const resistanceSlider = document.getElementById('resistance');
const voltageValue = document.getElementById('voltageValue');
const resistanceValue = document.getElementById('resistanceValue');
const currentValue = document.getElementById('currentValue');
const powerValue = document.getElementById('powerValue');
const statusValue = document.getElementById('statusValue');
const toggleBtn = document.getElementById('toggleBtn');
const resetBtn = document.getElementById('resetBtn');

function calculateCurrent() {
  return isClosed ? voltage / resistance : 0;
}

function calculatePower() {
  return isClosed ? voltage * voltage / resistance : 0;
}

function updateInfo() {
  const I = calculateCurrent();
  const P = calculatePower();
  currentValue.textContent = I.toFixed(2);
  powerValue.textContent = P.toFixed(2);
  statusValue.textContent = isClosed ? 'Замкнута' : 'Разомкнута';
  statusValue.style.color = isClosed ? '#00ff88' : '#ff5555';
  statusValue.style.fontSize = '16px';
  
  // Целевая яркость: чем больше мощность, тем ярче
  const target = isClosed ? Math.min(P / 10, 1) : 0;
  glowIntensity += (target - glowIntensity) * 0.15;
}

function drawBattery(x, y) {
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(x - 30, y - 20, 60, 40);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(x - 15, y - 10, 30, 20);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('+', x - 22, y + 5);
  ctx.fillText('−', x + 22, y + 5);
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.fillText('BAT', x, y + 32);
}

function drawLamp(x, y) {
  // Яркость лампы
  const brightness = glowIntensity;
  
  // Свечение
  if (brightness > 0.05) {
    const glow = ctx.createRadialGradient(x, y, 5, x, y, 80);
    glow.addColorStop(0, `rgba(255, 255, 100, ${brightness * 0.8})`);
    glow.addColorStop(0.5, `rgba(255, 200, 0, ${brightness * 0.3})`);
    glow.addColorStop(1, 'rgba(255, 200, 0, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, 80, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Колба лампы
  ctx.beginPath();
  ctx.arc(x, y, 30, 0, Math.PI * 2);
  ctx.fillStyle = brightness > 0.05 
    ? `rgba(255, 255, ${Math.floor(150 + brightness * 105)}, ${0.4 + brightness * 0.6})`
    : 'rgba(255, 255, 255, 0.1)';
  ctx.fill();
  ctx.strokeStyle = brightness > 0.05 ? '#ffd700' : '#555';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Нить накала
  ctx.beginPath();
  ctx.moveTo(x - 10, y + 10);
  ctx.lineTo(x - 5, y - 5);
  ctx.lineTo(x, y + 8);
  ctx.lineTo(x + 5, y - 5);
  ctx.lineTo(x + 10, y + 10);
  ctx.strokeStyle = brightness > 0.05 
    ? `rgba(255, 255, ${Math.floor(200 + brightness * 55)}, 1)` 
    : '#666';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // Цоколь
  ctx.fillStyle = '#888';
  ctx.fillRect(x - 10, y + 28, 20, 12);
  ctx.fillStyle = '#666';
  ctx.fillRect(x - 10, y + 34, 20, 4);
}

function drawSwitch(x, y) {
  // Контакты
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(x - 20, y, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 20, y, 5, 0, Math.PI * 2);
  ctx.fill();
  
  // Рычаг
  ctx.beginPath();
  if (isClosed) {
    ctx.moveTo(x - 20, y);
    ctx.lineTo(x + 20, y);
  } else {
    ctx.moveTo(x - 20, y);
    ctx.lineTo(x + 15, y - 25);
  }
  ctx.strokeStyle = isClosed ? '#00ff88' : '#ff5555';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.stroke();
  ctx.lineCap = 'butt';
  
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('SWITCH', x, y + 25);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  const batteryX = 100, batteryY = 200;
  const lampX = 500, lampY = 150;
  const switchX = 300, switchY = 340;
  
  // Провода (фон)
  ctx.strokeStyle = isClosed ? '#ffd700' : '#555';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  
  // Верхний провод: батарея → лампа
  ctx.beginPath();
  ctx.moveTo(batteryX + 30, batteryY - 20);
  ctx.lineTo(batteryX + 30, 100);
  ctx.lineTo(lampX, 100);
  ctx.lineTo(lampX, lampY - 30);
  ctx.stroke();
  
  // Правый провод: лампа → выключатель
  ctx.beginPath();
  ctx.moveTo(lampX + 30, lampY);
  ctx.lineTo(600, lampY);
  ctx.lineTo(600, switchY);
  ctx.lineTo(switchX + 20, switchY);
  ctx.stroke();
  
  // Нижний провод: выключатель → батарея
  ctx.beginPath();
  ctx.moveTo(switchX - 20, switchY);
  ctx.lineTo(100, switchY);
  ctx.lineTo(100, batteryY + 20);
  ctx.stroke();
  
  // Анимация тока (движущиеся точки)
  if (isClosed) {
    const t = Date.now() / 500;
    const speed = Math.min(voltage / resistance, 2);
    
    // Точки на верхнем проводе
    for (let i = 0; i < 8; i++) {
      const progress = ((t * speed + i / 8) % 1);
      let px, py;
      if (progress < 0.5) {
        // От батареи до лампы
        px = batteryX + 30 + (lampX - batteryX - 30) * (progress * 2);
        py = 100;
      } else {
        px = lampX;
        py = 100 + (lampY - 30 - 100) * ((progress - 0.5) * 2);
      }
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 10;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  
  // Элементы
  drawBattery(batteryX, batteryY);
  drawLamp(lampX, lampY);
  drawSwitch(switchX, switchY);
  
  // Подписи параметров рядом с элементами
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(voltage.toFixed(1) + ' В', batteryX, batteryY - 40);
  ctx.fillText(resistance + ' Ом', lampX - 60, lampY + 50);
}

function animate() {
  updateInfo();
  draw();
  requestAnimationFrame(animate);
}

voltageSlider.addEventListener('input', (e) => {
  voltage = parseFloat(e.target.value);
  voltageValue.textContent = voltage + ' В';
});

resistanceSlider.addEventListener('input', (e) => {
  resistance = parseInt(e.target.value);
  resistanceValue.textContent = resistance + ' Ом';
});

toggleBtn.addEventListener('click', () => {
  isClosed = !isClosed;
  toggleBtn.textContent = isClosed ? '🔌 Разомкнуть цепь' : '🔌 Замкнуть цепь';
});

resetBtn.addEventListener('click', () => {
  isClosed = false;
  voltage = 6;
  resistance = 10;
  voltageSlider.value = 6;
  resistanceSlider.value = 10;
  voltageValue.textContent = '6 В';
  resistanceValue.textContent = '10 Ом';
  toggleBtn.textContent = '🔌 Замкнуть цепь';
  glowIntensity = 0;
  updateInfo();
  draw();
});

animate();
</script>

</body>
</html>
